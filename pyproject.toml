[project]
name = "mtt"
version = "0.1.0"
description = "Multi Tier Tokenisation (WLT + CLT) prototype and letter-level experiment"
requires-python = ">=3.11"
dependencies = ["torch>=2.0", "tokenizers>=0.15", "numpy", "matplotlib"]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
